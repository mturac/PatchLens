name: Materialize source

on:
  push:
    branches: [feat/patchlens-core]
    paths:
      - ".bootstrap/chunks/**"
      - ".github/workflows/materialize-source.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/patchlens-core
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and validate exact source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunks/part.* | tr -d '\r\n' | base64 --decode > /tmp/patchlens-source.tar.gz
          echo "3a69bb1007ca06e0b34fe26cbe87b36788a286ebd7f9e02039de43e8b71267c4  /tmp/patchlens-source.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/patchlens-source.tar.gz > /tmp/patchlens-files.txt
          grep -Fxq './package.json' /tmp/patchlens-files.txt
          grep -Fxq './src/review.ts' /tmp/patchlens-files.txt
          grep -Fxq './test/review.test.mjs' /tmp/patchlens-files.txt

      - name: Materialize repository source
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/materialize-source.yml /tmp/materialize-source.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/patchlens-source.tar.gz -C .
          mkdir -p docs/assets .github/workflows
          cp /tmp/materialize-source.yml .github/workflows/materialize-source.yml
          chmod +x bin/patchlens.mjs

      - name: Install PNG renderer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick fonts-dejavu-core

      - name: Render polished PNG hero
        shell: bash
        run: |
          set -euo pipefail
          convert -size 1536x860 gradient:'#080b18-#2b103f' \
            -fill '#ffffff' -font DejaVu-Sans-Bold -pointsize 108 -annotate +88+165 'PatchLens' \
            -fill '#ff8a2a' -font DejaVu-Sans-Bold -pointsize 42 -annotate +92+232 'AI diff review with evidence, not vibes.' \
            -fill '#b9c2d9' -font DejaVu-Sans -pointsize 28 -annotate +92+286 'Scope. Tests. Migrations. Dependencies. Secrets. Completion claims.' \
            -fill '#161a2c' -stroke '#3b4260' -strokewidth 2 -draw 'roundrectangle 88,350 492,724 28,28' \
            -fill '#161a2c' -stroke '#3b4260' -strokewidth 2 -draw 'roundrectangle 566,350 970,724 28,28' \
            -fill '#161a2c' -stroke '#3b4260' -strokewidth 2 -draw 'roundrectangle 1044,350 1448,724 28,28' \
            -fill '#ff8a2a' -stroke none -draw 'circle 154,420 154,386' \
            -fill '#7c5cff' -draw 'circle 632,420 632,386' \
            -fill '#2dd4bf' -draw 'circle 1110,420 1110,386' \
            -fill '#ffffff' -font DejaVu-Sans-Bold -pointsize 34 -annotate +122+432 '1' \
            -annotate +600+432 '2' -annotate +1078+432 '3' \
            -fill '#ffffff' -font DejaVu-Sans-Bold -pointsize 34 -annotate +126+500 'Parse the change' \
            -annotate +604+500 'Run the rules' -annotate +1082+500 'Issue the verdict' \
            -fill '#b9c2d9' -font DejaVu-Sans -pointsize 25 -annotate +126+556 'Unified diff or Git range' \
            -annotate +126+598 'Deterministic file model' -annotate +126+640 'No source upload' \
            -annotate +604+556 'Seven evidence-backed rules' -annotate +604+598 'Severity + confidence' -annotate +604+640 'No hidden LLM call' \
            -annotate +1082+556 'JSON + Markdown report' -annotate +1082+598 'CI-friendly exit codes' -annotate +1082+640 'Safe redaction by default' \
            -fill '#ff8a2a' -font DejaVu-Sans-Bold -pointsize 30 -annotate +92+800 '$ patchlens review HEAD~1..HEAD' \
            -strip docs/assets/patchlens-hero.png
          test "$(identify -format '%wx%h' docs/assets/patchlens-hero.png)" = '1536x860'
          test "$(stat -c %s docs/assets/patchlens-hero.png)" -gt 10000

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add deterministic AI diff reviewer"
          git push origin HEAD:feat/patchlens-core
